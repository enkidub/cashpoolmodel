const Ico = ({ name, size = 15, color = 'currentColor' }) => (

// ─── Ring ─────────────────────────────────────────────────────────────────

const Ring = ({ value, size = 46 }) => {
  const r = (size - 5.6) / 2;
  const cir = 2 * Math.PI * r;
  const arc = (value / 100) * cir;
  const c = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={c} cy={c} r={r} fill="none" stroke="#f1f5f9" strokeWidth="2.8"/>
      <circle cx={c} cy={c} r={r} fill="none" stroke="var(--indigo)" strokeWidth="2.8"
        strokeDasharray={`${arc} ${cir}`} strokeLinecap="round"
        style={{ transform: 'rotate(-90deg)', transformOrigin: '50% 50%' }}/>
    </svg>
  );
};

// ─── Data ─────────────────────────────────────────────────────────────────

  { label:'Netting Efficiency',   value:'73%',    badge:'↑ 12pp',  sub:'above sector benchmark',       ring:73   },

// ─── Date helpers ─────────────────────────────────────────────────────────
const NOW = new Date();
const fmtMonthYear = (d) => d.toLocaleString('en-GB', { month: 'short', year: 'numeric' });
const fmtFullDate  = (d) => d.toLocaleString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtDateTime  = (d) => d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function genLastQuarters(n) {
  const curQ  = Math.floor(NOW.getMonth() / 3);
  const year  = NOW.getFullYear();
  const result = [];
  for (let i = n - 1; i >= 0; i--) {
    const totalQ = curQ - i;
    const yr = year + Math.floor(totalQ / 4);
    const q  = ((totalQ % 4) + 4) % 4;
    result.push(`Q${q + 1} ${yr}`);
  }
  return result;
}

const SUBS = [

// ─── Bar Chart ─────────────────────────────────────────────────────────────

function BarChart({ sim, calc }) {
  const [volatility, setVolatility] = React.useState(0.12);
  const [chartData, setChartData]   = React.useState(() => simulateQuarterly(sim, calc, 0.12));
  const [hov, setHov]               = React.useState(null);

  React.useEffect(() => {
    setChartData(simulateQuarterly(sim, calc, volatility));
  }, [volatility]);

  const newSeed = () => setChartData(simulateQuarterly(sim, calc, volatility));

  const ccy     = getCcySymbol(sim);
  const ccyCode = getCcyCode(sim);

  const data   = chartData;
  const maxVal = Math.max(...data.flatMap(d => [d.without, d.pooled]), 50);
  const CMAX   = Math.ceil(maxVal / 50) * 50 + 30;
  const CH     = 200;
  const ph     = v => `${Math.max(4, (v / CMAX) * CH)}px`;

  const totalWithout = data.reduce((s, d) => s + d.without, 0);
  const totalPooled  = data.reduce((s, d) => s + d.pooled,  0);
  const totalSaved   = totalWithout - totalPooled;
  const savingPct    = totalWithout > 0 ? Math.round(totalSaved / totalWithout * 100) : 0;

  const yStep  = Math.max(50, Math.ceil(CMAX / 4 / 50) * 50);
  const yTicks = [0, yStep, yStep * 2, yStep * 3];

  const volLabel = volatility < 0.08 ? 'Holding company'
    : volatility < 0.15 ? 'Operating company'
    : volatility < 0.22 ? 'Seasonal business' : 'Trading company';

  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm" style={{ padding:24 }}>

      {/* Header */}
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:14 }}>
        <div>
          <div style={{ fontSize:14, fontWeight:600, color:'#1e293b' }}>
            Interest Cost: Before vs. After Pooling
          </div>
          <div style={{ fontSize:11, color:'#94a3b8', marginTop:2 }}>
            Quarterly deficit financing cost · {ccyCode} thousands ·
            <span style={{ color:'#d97706', fontWeight:600, marginLeft:4 }}>⚡ Simulated estimate</span>
          </div>
        </div>
        <div style={{ display:'flex', gap:16, alignItems:'center' }}>
          {[
            { bg:'#e2e8f0', border:'#cbd5e1', label:'Without pooling' },
            { bg:'#0b1929', border:'#0b1929', label:'With CashPoolModel' },
          ].map(({ bg, border, label }) => (
            <div key={label} style={{ display:'flex', alignItems:'center', gap:6 }}>
              <div style={{ width:12, height:12, borderRadius:3, background:bg, border:`1.5px solid ${border}` }}/>
              <span style={{ fontSize:11, color:'#64748b' }}>{label}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Volatility slider */}
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14,
        background:'#f8fafc', borderRadius:8, padding:'7px 14px', border:'1px solid #e2e8f0' }}>
        <span style={{ fontSize:10, fontWeight:700, color:'#94a3b8', textTransform:'uppercase',
          letterSpacing:'.7px', whiteSpace:'nowrap' }}>Balance volatility</span>
        <input type="range" min="3" max="35" step="1"
          value={Math.round(volatility * 100)}
          onChange={e => setVolatility(parseInt(e.target.value) / 100)}
          style={{ flex:1, accentColor:'#0b1929' }}/>
        <span style={{ fontFamily:'DM Mono, monospace', fontSize:13, fontWeight:700,
          color:'#0b1929', minWidth:32, textAlign:'right' }}>
          {Math.round(volatility * 100)}%
        </span>
        <button onClick={newSeed}
          title="Generate a new random scenario at the same volatility"
          style={{ padding:'4px 12px', borderRadius:6, background:'#0b1929', color:'#fff',
            fontFamily:'DM Sans, sans-serif', fontSize:11, fontWeight:600,
            border:'none', cursor:'pointer', whiteSpace:'nowrap' }}>
          New seed ↺
        </button>
        <span style={{ fontSize:9, color:'#94a3b8', whiteSpace:'nowrap' }}>{volLabel}</span>
      </div>

      {/* Chart area */}
      <div style={{ display:'flex', alignItems:'flex-start', gap:0 }}>
        <div style={{ position:'relative', width:52, height:CH, flexShrink:0 }}>
          {yTicks.map(v => (
            <span key={v} style={{ position:'absolute', right:8,
              bottom:`calc(${(v / CMAX) * CH}px - 6px)`,
              fontSize:9, fontFamily:'DM Mono, monospace', color:'#94a3b8', lineHeight:1 }}>
              {ccy}{v.toLocaleString('en-US')}k
            </span>
          ))}
        </div>
        <div style={{ flex:1, position:'relative', height:CH,
          borderLeft:'1px solid #e2e8f0', borderBottom:'1px solid #e2e8f0' }}>
          {yTicks.slice(1).map(v => (
            <div key={v} style={{ position:'absolute', left:0, right:0,
              bottom:`${(v / CMAX) * CH}px`,
              borderTop:'1px dashed #f1f5f9', pointerEvents:'none' }}/>
          ))}
          <div style={{ position:'absolute', inset:0, display:'flex',
            alignItems:'flex-end', justifyContent:'space-around', padding:'0 24px' }}>
            {data.map((d, gi) => (
              <div key={gi} style={{ display:'flex', alignItems:'flex-end', gap:5 }}>

                {/* Without bar */}
                <div onMouseEnter={() => setHov({ gi, which:'without' })}
                  onMouseLeave={() => setHov(null)}
                  style={{ position:'relative', cursor:'default' }}>
                  <div style={{ width:34, borderRadius:'3px 3px 0 0',

                  {hov?.gi === gi && hov?.which === 'without' && (
                    <div style={{ position:'absolute', bottom:`calc(${ph(d.without)} + 6px)`,
                      left:'50%', transform:'translateX(-50%)', background:'#1e293b', color:'#fff',
                      fontSize:10, fontFamily:'DM Mono, monospace', padding:'4px 8px',
                      borderRadius:4, whiteSpace:'nowrap', zIndex:10, lineHeight:1.5 }}>
                      <div>{ccy}{d.without.toLocaleString('en-US')}k bilateral cost</div>
                      <div style={{ color:'#94a3b8' }}>full deficit × {((calc?.dr||0.055)*100).toFixed(2)}%</div>

                </div>

                {/* Pooled bar */}
                <div onMouseEnter={() => setHov({ gi, which:'pooled' })}
                  onMouseLeave={() => setHov(null)}
                  style={{ position:'relative', cursor:'default' }}>
                  <div style={{ width:34, borderRadius:'3px 3px 0 0',
                    height: ph(d.pooled), background:'#0b1929',
                    opacity: hov && (hov.gi !== gi || hov.which !== 'pooled') ? 0.4 : 1,

                  {hov?.gi === gi && hov?.which === 'pooled' && (
                    <div style={{ position:'absolute', bottom:`calc(${ph(d.pooled)} + 6px)`,
                      left:'50%', transform:'translateX(-50%)', background:'#0b1929', color:'#fff',

                      borderRadius:4, whiteSpace:'nowrap', zIndex:10, lineHeight:1.5 }}>

                      <div style={{ color:'#4ade80' }}>↓ save {ccy}{(d.without - d.pooled).toLocaleString('en-US')}k</div>

              </div>
            ))}
          </div>
        </div>
      </div>

      {/* X-axis */}
      <div style={{ display:'flex', justifyContent:'space-around', paddingLeft:52, marginTop:6 }}>
        {data.map((d, i) => (
          <span key={i} style={{ fontSize:10, color:'#94a3b8' }}>{d.period}</span>

      {/* Summary strip */}

        display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:12 }}>
        {[
          {
            label: 'Annual cost — no pool',
            value: `${ccy}${totalWithout.toLocaleString('en-US')}k`,
            color: '#475569',
            sub:   `deficit × ${((calc?.dr||0.055)*100).toFixed(2)}%`,

          {
            label: 'Annual cost — with pool',
            value: `${ccy}${totalPooled.toLocaleString('en-US')}k`,
            color: '#0b1929',
            sub:   `deficit × ${((calc?.pdr||0.032)*100).toFixed(2)}%`,
          },
          {
            label: 'Rate saving',
            value: `${ccy}${totalSaved.toLocaleString('en-US')}k`,
            color: '#059669',
            sub:   `lower pool rate`,
          },
          {
            label: 'Netting bonus',
            value: `+${ccy}${data.reduce((s,d)=>s+(d.nettingSaving||0),0).toLocaleString('en-US')}k`,
            color: '#059669',
            sub:   `internal offset`,
          },
        ].map(({ label, value, color, sub }) => (
          <div key={label}>
            <div style={{ fontSize:10, color:'#94a3b8', marginBottom:3 }}>{label}</div>
            <div style={{ fontFamily:'DM Mono, monospace', fontSize:15, fontWeight:700, color }}>
              {value}
            </div>
            <div style={{ fontSize:9, color:'#94a3b8', marginTop:2 }}>{sub}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Table ────────────────────────────────────────────────────────────────

function SubsidiaryTable({ entities: ents, calc, sim }) {
  const [expanded, setExpanded] = React.useState(false);
  const ccy = getCcySymbol(sim);
  let subs;
  if (ents && ents.length > 0) {
    const dr  = calc?.dr  || 0.055;
    const cr  = calc?.cr  || 0.028;
    const pdr = calc?.pdr || 0.032;
    const pcr = calc?.pcr || 0.040;
    const dcf = calc?.dcf || 1;

    const withSavings = ents.map(e => {
      const bal = typeof e.balNum === 'number' ? e.balNum
                : typeof e.balance === 'number' ? e.balance : 0;
      let saving = 0;
      if (bal > 0) saving = bal * (pcr - cr) * dcf;
      if (bal < 0) saving = Math.abs(bal) * (dr - pdr) * dcf;
      return { ...e, savingNum: Math.round(saving) };
    });

    const totalSaving = withSavings.reduce((s, e) => s + Math.max(0, e.savingNum), 0) || 1;

    const fmtBal = (bal) => {
      const a = Math.abs(bal);
      if (bal === 0) return '+' + ccy + '0k';
      const s = bal > 0 ? '+' : '−';
      if (a >= 1e6) return s + ccy + (a / 1e6).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }) + 'M';
      return s + ccy + Math.round(a / 1e3).toLocaleString('en-US') + 'k';
    };

    const fmtSav = (n) => {
      const a = Math.abs(n);
      if (n === 0) return ccy + '0k';
      const s = n > 0 ? '+' : '−';
      if (a >= 1e6) return s + ccy + (a / 1e6).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }) + 'M';
      return s + ccy + Math.round(a / 1e3).toLocaleString('en-US') + 'k';
    };

    subs = withSavings.map(e => ({
      name:      e.name,
      cc:        e.cc,
      balance:   fmtBal(typeof e.balance === 'number' ? e.balance : 0),
      savings:   fmtSav(e.savingNum),
      savingNum: e.savingNum,
      pct:       e.savingNum > 0 ? Math.round(e.savingNum / totalSaving * 100) : 0,
    })).sort((a, b) => b.savingNum - a.savingNum);
  } else {
    subs = SUBS;
  }

  const maxPct = Math.max(...subs.map(s => s.pct), 1);
  const displaySubs = expanded ? subs : subs.slice(0, 5);

  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div style={{ padding:'16px 24px', borderBottom:'1px solid #f1f5f9',
        display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div>
          <div style={{ fontSize:13, fontWeight:600, color:'#1e293b' }}>Top Contributing Subsidiaries</div>
          <div style={{ fontSize:11, color:'#94a3b8', marginTop:2 }}>
            Ranked by projected annual savings · {expanded ? subs.length : Math.min(5, subs.length)} of {subs.length} shown
          </div>
        </div>
        {subs.length > 5 && (
          <button onClick={() => setExpanded(x => !x)}
            style={{ fontSize:11, color:'#0b1929', display:'flex', alignItems:'center', gap:4,
              background:'none', border:'1px solid #e2e8f0', borderRadius:6, padding:'4px 10px',
              cursor:'pointer', fontFamily:'DM Sans, sans-serif', fontWeight:600 }}>
            {expanded ? 'Show less' : `View all (${subs.length})`}
            <Ico name="chevron" size={11} color="#0b1929"/>
          </button>
        )}
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'2fr 80px 1fr 1fr 160px', padding:'10px 24px',
        background:'#f8fafc', borderBottom:'1px solid #f1f5f9' }}>
        {['Subsidiary','Ccy','Avg Balance','Proj. Savings','Contribution'].map(h => (
          <span key={h} style={{ fontSize:10, fontWeight:700, color:'#94a3b8',
            textTransform:'uppercase', letterSpacing:'0.07em' }}>{h}</span>
        ))}
      </div>

      {displaySubs.map((s, i) => (
        <div key={i}
          style={{ display:'grid', gridTemplateColumns:'2fr 80px 1fr 1fr 160px',
            padding:'13px 24px',
            borderBottom: i < displaySubs.length - 1 ? '1px solid #f8fafc' : 'none',
            alignItems:'center', transition:'background 0.1s' }}
          onMouseEnter={e => e.currentTarget.style.background = '#f8fafc'}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>

          {/* Name */}
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:20, height:20, borderRadius:4, background:'#f1f5f9',
              border:'1px solid #e2e8f0', display:'flex', alignItems:'center',
              justifyContent:'center', flexShrink:0 }}>
              <span style={{ fontSize:7, fontWeight:700, color:'#64748b', textTransform:'uppercase' }}>{s.cc}</span>
            </div>

function PoolStructure({ entities: ents, poolBank, poolBalance, nettingEff, baseCurrency, sim }) {
  const entityList = ents || ENTITIES;

  // Master entity: has no parentName (or parentName explicitly null) and name contains 'master',
  // OR is the entity whose name is referenced as parent by others
  const masterEnt = entityList.find(e =>
    e.name?.toLowerCase().includes('master') && (e.parentName == null || e.parentName === undefined)
  ) || entityList.find(e =>
    e.parentName == null && entityList.some(o => o.parentName === e.name)
  );
  const masterName = masterEnt?.name || null;

  const baseCcy = baseCurrency || masterEnt?.cc || (() => {
    const counts = {};
    entityList.forEach(e => { if (e.cc) counts[e.cc] = (counts[e.cc]||0)+1; });
    return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0] || 'EUR';
  })();

  const ccySym = { EUR:'€', USD:'$', GBP:'£', CHF:'CHF ', CZK:'Kč ', PLN:'zł ',
    HUF:'Ft ', SEK:'kr ', DKK:'kr ', NOK:'kr ', HKD:'HK$', SGD:'S$', JPY:'¥' }[baseCcy] || baseCcy + ' ';

  function pbNum(bal) {
    if (!bal) return 0;
    const neg = bal.includes('−') || bal.startsWith('-');
    const num = parseFloat(bal.replace(/[^0-9.]/g, ''));
    const k = bal.toLowerCase().includes('k');
    return (neg ? -1 : 1) * (k ? num / 1000 : num);
  }
  function isRoot(e) {
    return e.parentIdx === undefined || e.parentIdx === null || e.parentIdx === '';
  }
  function regionColor(cc) {
    const map = { DE:'#2563eb', FR:'#7c3aed', NL:'#0891b2', GB:'#be185d', AT:'#dc2626',
      CH:'#d97706', BE:'#059669', IT:'#0284c7', ES:'#9333ea', CZ:'#6366f1',
      SK:'#0d9488', PL:'#d946ef', HU:'#f59e0b', SE:'#10b981', DK:'#3b82f6',
      NO:'#f97316', FI:'#8b5cf6', PT:'#06b6d4', LU:'#e11d48', IE:'#16a34a' };
    return map[(cc||'').toUpperCase()] || '#64748b';
  }
  // Resolve effective parent name (supports parentName field or parentIdx index)
  function effParent(e) {
    if (e.parentName !== undefined) return e.parentName;
    if (e.parentIdx != null && e.parentIdx !== '') return entityList[parseInt(e.parentIdx)]?.name || null;
    return null;
  }

  // L2: direct children of master. L3: children of L2.
  const l2Entities = masterName
    ? entityList.filter(e => { const pn = effParent(e); return pn === masterName || (pn?.toLowerCase().includes('master')); })
    : entityList.filter(e => effParent(e) == null && !(e.name?.toLowerCase().includes('master') && pbNum(e.balance) === 0));

  const l3Entities = masterName
    ? entityList.filter(e => { const pn = effParent(e); return pn && pn !== masterName && !pn.toLowerCase().includes('master'); })
    : entityList.filter(e => effParent(e) != null);

  const getChildrenOf = (parentEntityName) => l3Entities.filter(e => effParent(e) === parentEntityName);

  // Netting flow: exclude master account
  const surplusTotal = entityList.filter(e => e.surplus && effParent(e) != null).reduce((s, e) => s + Math.abs(pbNum(e.balance)), 0);
  const deficitTotal = entityList.filter(e => !e.surplus && effParent(e) != null).reduce((s, e) => s + Math.abs(pbNum(e.balance)), 0);
  const zbaRaw   = nettingEff ? parseFloat(nettingEff) : (surplusTotal + deficitTotal > 0 ? Math.round(Math.min(surplusTotal, deficitTotal) / (surplusTotal + deficitTotal) * 100) : 0);
  const zbaColor = zbaRaw >= 60 ? '#059669' : zbaRaw >= 30 ? '#d97706' : '#dc2626';
  const zbaBg    = zbaRaw >= 60 ? '#ecfdf5' : zbaRaw >= 30 ? '#fffbeb' : '#fee2e2';
  const zbaLabel   = nettingEff || (zbaRaw + '%');
  const poolType   = sim?.poolType || 'zba';
  const effLabel   = poolType === 'notional' ? 'Notional Offset'
    : poolType === 'tba' ? 'TBA Efficiency'
    : 'ZBA Efficiency';
  const nettingTip = (poolType === 'notional'
    ? `Notional Offset — ${zbaRaw}% of balances virtually offset (no physical sweep)`
    : `${effLabel}: ${zbaRaw}% = min(surplus,deficit)÷(surplus+deficit)`)
    + (zbaRaw >= 60 ? ' · Strong pool — efficient netting'
    : zbaRaw >= 30 ? ' · Adequate — negotiate better rates'
    : ' · Low netting — consider restructuring entity mix');

  // Card renderer for L2/L3 entities — compact 2-row layout
  function renderCard(e, isL3) {
    const accentColor = poolType === 'notional' ? '#6366f1' : (e.surplus ? '#059669' : '#dc2626');
    const accentBg    = poolType === 'notional' ? '#eef2ff' : (e.surplus ? '#ecfdf5' : '#fee2e2');
    const isNonBase   = e.cc !== baseCcy;
    const regColor    = regionColor(e.domicile || e.country || 'DE');
    const domCode     = (e.domicile || e.country || '').toLowerCase();
    const balDisplay  = e.surplus
      ? (e.balance?.startsWith('+') ? e.balance : '+' + (e.balance || '0'))
      : (e.balance?.startsWith('−') || e.balance?.startsWith('-') ? e.balance : '−' + (e.balance || '0'));
    return (
      <div style={{ borderRadius:8, background:'#fff',
        border:`1.5px solid ${poolType === 'notional' ? '#c7d2fe' : (e.surplus ? '#d1fae5' : '#fee2e2')}`,
        borderLeft:`4px solid ${regColor}`,
        position:'relative', overflow:'hidden',
        transition:'transform .15s, box-shadow .15s', cursor:'default',
        boxShadow: isL3 ? 'none' : '0 1px 3px rgba(15,23,42,.04)',
        opacity: isL3 ? 0.95 : 1 }}
        onMouseEnter={ev => { ev.currentTarget.style.transform='translateY(-1px)'; ev.currentTarget.style.boxShadow='0 3px 10px rgba(15,23,42,.08)'; }}
        onMouseLeave={ev => { ev.currentTarget.style.transform=''; ev.currentTarget.style.boxShadow= isL3 ? 'none' : '0 1px 3px rgba(15,23,42,.04)'; }}>
        <div style={{ position:'absolute', top:0, left:4, right:0, height:2.5, background:accentColor }} />
        <div style={{ padding:'8px 11px', paddingTop:10 }}>
          {/* Row 1: flag + name + surplus/deficit badge */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:5 }}>
            <div style={{ display:'flex', alignItems:'center', gap:6, minWidth:0 }}>
              <span className={'fi fi-' + domCode} style={{ width:16, height:12, display:'inline-block', borderRadius:1, flexShrink:0 }} />
              <div style={{ minWidth:0 }}>
                <div style={{ fontSize:10, fontWeight:700, color:'#0f172a', lineHeight:1.2,
                  whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', maxWidth:110 }}>{e.name}</div>
                <div style={{ fontSize:8, color:'#94a3b8', marginTop:1 }}>{e.domicile || e.country || '—'}</div>
              </div>
            </div>
            <div style={{ fontSize:8, fontWeight:700, color:accentColor, background:accentBg,
              padding:'2px 6px', borderRadius:99, flexShrink:0, whiteSpace:'nowrap', marginLeft:4 }}>
              {poolType === 'notional' ? (e.surplus ? '○ Net credit' : '○ Net debit') : (e.surplus ? '↑ Surplus' : '↓ Deficit')}
            </div>
          </div>
          {/* Row 2: balance + cc tag + FX + rate with tooltip */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:6 }}>
            <div style={{ fontFamily:'DM Mono,monospace', fontSize:14, fontWeight:700,
              color:accentColor, letterSpacing:'-.3px', flexShrink:0 }}>{balDisplay}</div>
            <div style={{ display:'flex', alignItems:'center', gap:4, flexShrink:0 }}>
              <span style={{ fontSize:8, fontWeight:700, color:'#94a3b8', textTransform:'uppercase',
                background:'#f8fafc', border:'1px solid #e2e8f0', padding:'1px 5px', borderRadius:3 }}>{e.cc}</span>
              {isNonBase && (
                <span style={{ fontSize:8, fontWeight:700, color:'#92400e',
                  background:'#fef3c7', border:'1px solid #fde68a', padding:'1px 4px', borderRadius:3 }}>FX</span>
              )}
              <span
                title={e.surplus
                  ? 'Pool credit rate — interest earned on surplus balance at pool header. Higher than bilateral deposit rate.'
                  : 'Pool debit rate — interest charged on deficit funded by master. Lower than bilateral overdraft rate.'}
                style={{ fontSize:8, color:'#94a3b8', cursor:'help',
                  textDecoration:'underline', textDecorationStyle:'dotted', textUnderlineOffset:'2px' }}>
                {e.interestRate}
              </span>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>

      {/* ── Hierarchy card ── */}
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm" style={{ padding:28 }}>

        {/* Header */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
          <div style={{ fontSize:11, fontWeight:600, color:'#94a3b8', textTransform:'uppercase', letterSpacing:'0.08em' }}>
            {poolType === 'notional' ? 'Notional Offset Structure' : 'Pool Hierarchy — Daily Sweep Structure'} · <span style={{ fontWeight:400, textTransform:'none', letterSpacing:0 }}>as of {fmtMonthYear(NOW)}</span>
          </div>
          <div style={{ display:'flex', gap:6, alignItems:'center' }}>
            <div title={nettingTip}
              style={{ display:'flex', alignItems:'center', gap:5, background: zbaBg,
                border:`1px solid ${zbaColor}55`, borderRadius:6, padding:'4px 10px', cursor:'default' }}>
              <span style={{ fontSize:9, color:'#94a3b8', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.06em' }}>{effLabel}</span>
              <span style={{ fontSize:11, fontWeight:700, color: zbaColor, fontFamily:'DM Mono,monospace' }}>{zbaLabel}</span>
              <span style={{ fontSize:9, color:zbaColor }}>{zbaRaw >= 60 ? '✓' : zbaRaw >= 30 ? '△' : '⚠'}</span>
            </div>
          </div>
        </div>

        {/* Master account pill */}
        <div style={{ display:'flex', justifyContent:'center', marginBottom:0 }}>
          <div style={{ borderRadius:8, padding:'10px 18px', background:'#fff',
            border:'1px solid #e2e8f0', position:'relative', overflow:'hidden', minWidth:200, maxWidth:320 }}>
            <div style={{ position:'absolute', top:0, left:0, right:0, height:2.5, background:'#1e3a5f' }} />
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6, marginTop:1 }}>
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <span style={{ fontSize:13 }}>🏛</span>
                <span style={{ fontSize:11, fontWeight:600, color:'#1e293b' }}>Master Account ({baseCcy})</span>
              </div>
              <div style={{ fontSize:9, fontWeight:700, color:'#1e3a5f', background:'#e0e7ff', padding:'2px 7px', borderRadius:99 }}>Pool Header</div>
            </div>
            <div style={{ fontFamily:'DM Mono,monospace', fontSize:14, fontWeight:700, color:'#059669', letterSpacing:'-.3px', marginBottom:5 }}>
              {poolBalance||'+€12.3M'}
            </div>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <div style={{ display:'flex', alignItems:'center', gap:5 }}>
                <span style={{ fontSize:9, fontWeight:700, color:'#94a3b8', textTransform:'uppercase', letterSpacing:'0.07em', background:'#f8fafc', border:'1px solid #e2e8f0', padding:'1px 6px', borderRadius:3 }}>{baseCcy}</span>
                <span style={{ fontSize:9, fontWeight:600, color:'#1e3a5f', background:'#e0e7ff', border:'1px solid #c7d2fe', padding:'1px 6px', borderRadius:3 }}>{poolBank||'ING Bank'}</span>
                <div style={{ display:'flex', alignItems:'center', gap:3, fontSize:9, fontWeight:600, color: poolType === 'notional' ? '#6366f1' : '#059669' }}>
                  <div style={{ width:5, height:5, borderRadius:'50%', background: poolType === 'notional' ? '#6366f1' : '#059669', animation: poolType === 'notional' ? 'none' : 'pulse 2s infinite' }} />
                  {poolType === 'notional' ? 'Notional · Virtual offset' : poolType === 'tba' ? 'TBA · Target sweep' : 'ZBA · Auto-sweep'}
                </div>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:3, fontSize:9, color:'#64748b' }}>

                16:00 CET
              </div>
            </div>
          </div>
        </div>

          const oneWayUp = subAccounts.filter(e => e.sweepDirection === 'one-way-up').length;
          const sweepLabel = isPhysical
            ? (twoWay > 0 ? '↕ Two-way daily sweep' : oneWayUp > 0 ? '↑ Surplus sweep only' : '↓ Funded only')
            : 'Virtual offset — no physical movement';
          const tip = isPhysical
            ? (twoWay > 0 ? 'Physical sweep: surplus and deficit balances moved to master daily'
              : oneWayUp > 0 ? 'One-way sweep: surplus accounts only — deficits funded by master'
              : 'One-way sweep: deficits funded by master — surplus stays in-place')

          return (

                    </div>
                  );

              </div>
            </div>
          );
        })()}

        {/* Legend */}
        <div style={{ marginTop:20, paddingTop:14, borderTop:'1px solid #f1f5f9',
          display:'flex', gap:20, justifyContent:'center', flexWrap:'wrap', alignItems:'center' }}>

          <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:11, color:'#64748b' }}>

      {/* ── Netting Flow ── */}

        <div style={{ fontSize:11, fontWeight:600, color:'#94a3b8', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:18 }}>

// ─── P&L Section ─────────────────────────────────────────────────────────
function PnL({ sim, fmtK, netBenefit, interestSave, opSave }) {
  const [hov, setHov] = React.useState(null);
  const calc = computeFromSim(sim);

  const nb   = netBenefit  || 842000;
  const is   = interestSave || 612000;
  const os   = opSave      || 230000;
  const costs = calc?.annualCosts || 70000;

  const fmtR = (n) => {
    const a = Math.abs(n);
    const s = n >= 0 ? '+' : '−';
    if (a >= 1e6) return s + '€' + (a/1e6).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2}) + 'M';
    return s + '€' + Math.round(a/1000).toLocaleString('en-US') + 'k';
  };
  const fmtA = (n) => {
    const a = Math.abs(n);
    if (a >= 1e6) return '€' + (a/1e6).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2}) + 'M';
    return '€' + Math.round(a/1000).toLocaleString('en-US') + 'k';
  };

  // Compute component values from sim data
  const surplus = sim?.surplus || 6200000;
  const deficit = sim?.deficit || 2100000;
  const dr  = calc?.dr  || 0.055;
  const cr  = calc?.cr  || 0.028;
  const pdr = calc?.pdr || 0.032;
  const pcr = calc?.pcr || 0.040;
  const dcf = calc?.dcf || 1;
  const netting = Math.min(surplus, deficit);

  const debitSavingAmt  = Math.round(deficit * (dr - pdr) * dcf);
  const creditUpliftAmt = Math.round(surplus * (pcr - cr) * dcf);
  const nettingAmt      = Math.round(netting * pdr * dcf);
  const fxAmt           = Math.round(os * 0.43);
  const facilityAmt     = os - fxAmt;

  const debitBefore  = Math.round(deficit * dr * dcf / 1000);
  const debitAfter   = Math.round(Math.max(0, deficit - netting) * pdr * dcf / 1000);
  const creditBefore = Math.round(surplus * cr * dcf / 1000);
  const creditAfter  = Math.round(surplus * pcr * dcf / 1000);
  const PL_MAX = Math.max(debitBefore, creditAfter, 50);
  const PL_CH  = 160;
  const ph = v => `${Math.max(2, (v / PL_MAX) * PL_CH)}px`;

  const rows = [
    { label:'Interest Expense (Debit)',  standalone:'−'+fmtA(deficit*dr*dcf),          pooled:'−'+fmtA(Math.max(0,deficit-netting)*pdr*dcf), delta:fmtR(debitSavingAmt),  pct:'+'+Math.round(debitSavingAmt/(deficit*dr*dcf||1)*100)+'%', pos:true },
    { label:'Interest Income (Credit)',  standalone:'+'+fmtA(surplus*cr*dcf),           pooled:'+'+fmtA(surplus*pcr*dcf),                    delta:fmtR(creditUpliftAmt), pct:'+'+Math.round(creditUpliftAmt/(surplus*cr*dcf||1)*100)+'%', pos:true },
    { label:'Netting Offset Saving',     standalone:'—',                                 pooled:'+'+fmtA(nettingAmt),                          delta:fmtR(nettingAmt),      pct:'New',  pos:true },
    { label:'FX Conversion Saving',      standalone:'—',                                 pooled:'+'+fmtA(fxAmt),                               delta:fmtR(fxAmt),           pct:'New',  pos:true },
    { label:'Facility Fee Reduction',    standalone:'—',                                 pooled:'+'+fmtA(facilityAmt),                         delta:fmtR(facilityAmt),     pct:'New',  pos:true },
    { label:'Pool Operating Costs',      standalone:'—',                                 pooled:'−'+fmtA(costs),                               delta:fmtR(-costs),          pct:'New',  pos:false },
  ];

  const standaloneCostNet = Math.round(deficit * dr * dcf - surplus * cr * dcf);
  const pooledCostNet     = Math.round(Math.max(0, deficit - netting) * pdr * dcf - surplus * pcr * dcf - nettingAmt - fxAmt - facilityAmt + costs);

  const bars = [
    { label:'Interest Expense', before: debitBefore,  after: debitAfter  },
    { label:'Interest Income',  before: creditBefore, after: creditAfter  },
    { label:'FX Saving',        before: 0,            after: Math.round(fxAmt/1000) },
    { label:'Facility Fees',    before: 0,            after: Math.round(facilityAmt/1000) },
  ];

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>

      {/* Summary KPIs */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:14 }}>
        {[
          { label:'Total Interest Saving',  value: fmtA(is),            badge:'↑ ' + Math.round(is/(deficit*dr*dcf||1)*100) + '%', sub:'vs standalone' },
          { label:'Netting Offset',         value: fmtA(nettingAmt),    badge:'New',       sub:'internal funding offset' },
          { label:'WHT Leakage',            value: '€0.00',             badge:'✓ Clear',   sub:'fully optimised' },
          { label:'Operational Savings',    value: fmtA(os),            badge:'Additional',sub:'FX, facility, accounts' },
        ].map((k,i) => <KPICard key={i} {...k} ring={null}/>)}
      </div>

      {/* P&L Table */}
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div style={{ padding:'14px 24px', borderBottom:'1px solid #f1f5f9', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div>
            <div style={{ fontSize:13, fontWeight:600, color:'#1e293b' }}>Before vs. After Pooling — Detailed P&L</div>
            <div style={{ fontSize:11, color:'#94a3b8', marginTop:2 }}>12-month horizon · EUR · as of {fmtMonthYear(NOW)}</div>
          </div>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr', padding:'10px 24px', background:'#f8fafc', borderBottom:'1px solid #f1f5f9' }}>
          {['Line Item','Standalone','Pooled','Delta','% Change'].map((h,i) => (
            <span key={h} style={{ fontSize:10, fontWeight:700, color: i===2?'#4f46e5':i===3?'#059669':'#94a3b8',
              textTransform:'uppercase', letterSpacing:'0.07em', textAlign: i>0?'right':'left' }}>{h}</span>
          ))}
        </div>
        {rows.map((r,i) => (
          <div key={i} style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr',
            padding:'12px 24px', borderBottom: i<rows.length-1?'1px solid #f8fafc':'none', alignItems:'center' }}
            onMouseEnter={ev => ev.currentTarget.style.background='#f8fafc'}
            onMouseLeave={ev => ev.currentTarget.style.background='transparent'}>
            <div style={{ fontSize:12, color:'#334155' }}>{r.label}</div>
            <div style={{ fontFamily:'DM Mono,monospace', fontSize:12, color:'#94a3b8', textAlign:'right' }}>{r.standalone}</div>
            <div style={{ fontFamily:'DM Mono,monospace', fontSize:12, color:'#4f46e5', fontWeight:600, textAlign:'right' }}>{r.pooled}</div>
            <div style={{ fontFamily:'DM Mono,monospace', fontSize:12, fontWeight:700, color: r.pos?'#059669':'#dc2626', textAlign:'right' }}>{r.delta}</div>
            <div style={{ fontFamily:'DM Mono,monospace', fontSize:11, color: r.pos?'#059669':'#dc2626', textAlign:'right' }}>{r.pct}</div>
          </div>
        ))}
        {/* Total row */}
        <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr',
          padding:'14px 24px', background:'#0f172a', alignItems:'center' }}>
          <div style={{ fontSize:12, fontWeight:700, color:'#fff' }}>NET ANNUAL BENEFIT</div>
          <div style={{ fontFamily:'DM Mono,monospace', fontSize:12, color:'rgba(255,255,255,.4)', textAlign:'right' }}>{fmtR(-standaloneCostNet)}</div>
          <div style={{ fontFamily:'DM Mono,monospace', fontSize:12, color:'#818cf8', fontWeight:700, textAlign:'right' }}>{fmtR(nb + standaloneCostNet)}</div>
          <div style={{ fontFamily:'DM Mono,monospace', fontSize:14, color:'#4ade80', fontWeight:700, textAlign:'right' }}>{fmtR(nb)}</div>
          <div style={{ fontFamily:'DM Mono,monospace', fontSize:11, color:'#4ade80', textAlign:'right' }}>{standaloneCostNet > 0 ? '+' + Math.round(nb/standaloneCostNet*100) + '%' : '—'}</div>
        </div>
      </div>

      {/* Bar chart */}
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm" style={{ padding:24 }}>
        <div style={{ fontSize:13, fontWeight:600, color:'#1e293b', marginBottom:4 }}>Cost of Debt — Standalone vs. Pooled</div>
        <div style={{ fontSize:11, color:'#94a3b8', marginBottom:20 }}>EUR thousands · annual · key line items</div>
        <div style={{ display:'flex', alignItems:'flex-end', gap:32, height:PL_CH, paddingLeft:8 }}>
          {bars.map((b,gi) => (
            <div key={gi} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:0, flex:1 }}>
              <div style={{ display:'flex', alignItems:'flex-end', gap:6, height:PL_CH }}>
                {b.before > 0 && (
                  <div onMouseEnter={() => setHov({gi,w:'before'})} onMouseLeave={() => setHov(null)}
                    style={{ position:'relative', width:28, borderRadius:'3px 3px 0 0',
                      height: ph(b.before), background:'#e2e8f0', cursor:'default',
                      opacity: hov&&(hov.gi!==gi||hov.w!=='before')?0.4:1, transition:'opacity .1s' }}>
                    {hov?.gi===gi&&hov?.w==='before'&&(
                      <div style={{ position:'absolute', bottom:`calc(${ph(b.before)} + 6px)`, left:'50%', transform:'translateX(-50%)',
                        background:'#1e293b', color:'#fff', fontSize:10, padding:'3px 7px', borderRadius:4,
                        fontFamily:'DM Mono,monospace', whiteSpace:'nowrap', zIndex:10 }}>€{b.before.toLocaleString('en-US')}k</div>
                    )}
                  </div>
                )}
                <div onMouseEnter={() => setHov({gi,w:'after'})} onMouseLeave={() => setHov(null)}
                  style={{ position:'relative', width:28, borderRadius:'3px 3px 0 0',
                    height: ph(Math.max(b.after,2)), background:'#4f46e5', cursor:'default',
                    opacity: hov&&(hov.gi!==gi||hov.w!=='after')?0.4:1, transition:'opacity .1s' }}>
                  {hov?.gi===gi&&hov?.w==='after'&&(
                    <div style={{ position:'absolute', bottom:`calc(${ph(Math.max(b.after,2))} + 6px)`, left:'50%', transform:'translateX(-50%)',
                      background:'#4338ca', color:'#fff', fontSize:10, padding:'3px 7px', borderRadius:4,
                      fontFamily:'DM Mono,monospace', whiteSpace:'nowrap', zIndex:10 }}>€{b.after.toLocaleString('en-US')}k</div>
                  )}
                </div>
              </div>
              <div style={{ fontSize:10, color:'#94a3b8', marginTop:8, textAlign:'center', lineHeight:1.3 }}>{b.label}</div>
            </div>
          ))}
        </div>
        <div style={{ display:'flex', gap:20, marginTop:16, justifyContent:'center' }}>
          {[{bg:'#e2e8f0',label:'Standalone'},{bg:'#4f46e5',label:'Pooled'}].map(l => (
            <div key={l.label} style={{ display:'flex', alignItems:'center', gap:6, fontSize:11, color:'#64748b' }}>
              <div style={{ width:12,height:12,borderRadius:3,background:l.bg }}/>
              {l.label}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── Sensitivity Section ──────────────────────────────────────────────────
const SENS_TEMPLATE = [
  [1010,1140,1260,1390,1510],
  [ 890,1010,1120,1230,1350],
  [ 630, 730, 842, 960,1070],
  [ 510, 600, 700, 800, 900],
  [ 390, 470, 560, 650, 740],
];

function Sensitivity({ netBenefit, fmtK, calc }) {
  const [hov, setHov] = React.useState(null);
  const nb = netBenefit || 842000;
  const scale = nb / 842000;
  const dynSens = SENS_TEMPLATE.map(row => row.map(v => Math.round(v * scale / 10) * 10));
  const baseVal  = dynSens[2][2];
  const bestVal  = dynSens[0][4];
  const worstVal = dynSens[4][0];
  const breakEven = Math.round((calc?.annualCosts || 70000) / 1000) * 10;

  function sensColorDyn(v) {
    const mid = baseVal;
    const r = bestVal > worstVal ? (v - worstVal) / (bestVal - worstVal) : 0.5;
    if (r >= 0.85) return { bg:'#047857', fg:'#fff' };
    if (r >= 0.70) return { bg:'#059669', fg:'#fff' };
    if (r >= 0.55) return { bg:'#10b981', fg:'#fff' };
    if (r >= 0.40) return { bg:'#34d399', fg:'#065f46' };
    if (r >= 0.25) return { bg:'#6ee7b7', fg:'#065f46' };
    if (r >= 0.10) return { bg:'#a7f3d0', fg:'#065f46' };
    return               { bg:'#ecfdf5', fg:'#065f46' };
  }

// ─── Monte Carlo Card ─────────────────────────────────────────────────────
function MonteCarloCard({ sim, calc }) {
  const [mcVol, setMcVol]         = React.useState(0.12);
  const [mcResult, setMcResult]   = React.useState(null);
  const [mcRunning, setMcRunning] = React.useState(false);

  const cardStyle  = { background:'#fff', border:'1px solid #e2e8f0', borderRadius:12, padding:'20px 24px', boxShadow:'0 1px 3px rgba(15,23,42,.06)' };
  const labelStyle = { fontSize:10, fontWeight:700, color:'#94a3b8', textTransform:'uppercase', letterSpacing:'1px', marginBottom:8, display:'flex', alignItems:'center', gap:6 };

  function runMC() {
    setMcRunning(true);
    setTimeout(() => {
      setMcResult(runMonteCarlo(sim, calc, mcVol, 1000));
      setMcRunning(false);
    }, 50);
  }

  const fmtMC = (n) => {
    if (n === null || n === undefined) return '—';
    const a = Math.abs(n);
    const s = n < 0 ? '−' : '+';
    if (a >= 1e6) return s + '€' + (a/1e6).toFixed(2) + 'M';
    if (a >= 1e3) return s + '€' + Math.round(a/1e3) + 'k';
    return s + '€' + Math.round(a);
  };

  const buildHistogram = (results, bins = 20) => {
    if (!results || !results.length) return [];
    const min = results[0], max = results[results.length - 1];
    const range = max - min || 1;
    const binSize = range / bins;
    const counts = Array(bins).fill(0);
    results.forEach(v => {
      const idx = Math.min(bins - 1, Math.floor((v - min) / binSize));
      counts[idx]++;
    });
    return counts.map((count, i) => ({
      from: Math.round(min + i * binSize),
      to:   Math.round(min + (i+1) * binSize),
      count,
      pct:  count / results.length,
    }));
  };

  const hist    = mcResult ? buildHistogram(mcResult.results) : [];
  const histMax = hist.length ? Math.max(...hist.map(b => b.count)) : 1;

  return (
    <div style={cardStyle}>
      <div style={labelStyle}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="1.8" strokeLinecap="round">
          <path d="M2 20h20M5 20V10l7-7 7 7v10"/>
        </svg>
        Monte Carlo Simulation
        <span style={{ marginLeft:'auto', fontSize:9, color:'#94a3b8' }}>1,000 scenarios</span>
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:16,
        background:'#f8fafc', borderRadius:8, padding:'8px 14px', border:'1px solid #e2e8f0' }}>
        <span style={{ fontSize:10, fontWeight:700, color:'#94a3b8', textTransform:'uppercase',
          letterSpacing:'.7px', whiteSpace:'nowrap' }}>Volatility</span>
        <input type="range" min="3" max="35" step="1"
          value={Math.round(mcVol * 100)}
          onChange={e => setMcVol(parseInt(e.target.value) / 100)}
          style={{ flex:1, accentColor:'#0b1929' }}/>
        <span style={{ fontFamily:'DM Mono, monospace', fontSize:13, fontWeight:700,
          color:'#0b1929', minWidth:36, textAlign:'right' }}>
          {Math.round(mcVol * 100)}%
        </span>
        <button onClick={runMC} disabled={mcRunning}
          style={{ padding:'6px 16px', borderRadius:6, background:'#0b1929', color:'#fff',
            fontFamily:'DM Sans, sans-serif', fontSize:12, fontWeight:600, border:'none',
            cursor: mcRunning ? 'not-allowed' : 'pointer', opacity: mcRunning ? 0.7 : 1,
            whiteSpace:'nowrap' }}>
          {mcRunning ? 'Running…' : 'Run simulation →'}
        </button>
      </div>

      {!mcResult && !mcRunning && (
        <div style={{ textAlign:'center', padding:'24px 0', color:'#94a3b8', fontSize:13 }}>
          Set volatility and click "Run simulation" to see the distribution of outcomes.
        </div>
      )}

      {mcResult && (
        <div>
          <div style={{ marginBottom:16 }}>
            <div style={{ fontSize:11, color:'#94a3b8', marginBottom:8 }}>
              Distribution of annual net savings — 1,000 simulated scenarios
            </div>
            <div style={{ display:'flex', alignItems:'flex-end', gap:2, height:80, marginBottom:4 }}>
              {hist.map((b, i) => {
                const h = Math.max(2, Math.round((b.count / histMax) * 80));
                return (
                  <div key={i} title={`${fmtMC(b.from)} to ${fmtMC(b.to)}: ${b.count} scenarios`}
                    style={{ flex:1, height:`${h}px`,
                      background: b.from >= 0 ? '#0b1929' : '#dc2626',
                      borderRadius:'2px 2px 0 0', opacity:0.7+(b.pct*0.3), cursor:'default' }}/>
                );
              })}
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:9,
              color:'#94a3b8', fontFamily:'DM Mono, monospace' }}>
              <span>{fmtMC(mcResult.p5)}</span>
              <span>P50: {fmtMC(mcResult.p50)}</span>
              <span>{fmtMC(mcResult.p95)}</span>
            </div>

            padding:'10px 14px', display:'flex', gap:24, flexWrap:'wrap' }}>

              { label:'Probability of positive return', val:`${mcResult.probPositive}%` },
              { label:'Probability of saving > €500k',  val:`${mcResult.probGt500k}%` },
              { label:'Mean outcome', val:fmtMC(mcResult.mean), dark:true },
            ].map(({ label, val, dark }) => (
              <div key={label}>
                <div style={{ fontSize:9, color:'#065f46', fontWeight:700,
                  textTransform:'uppercase', letterSpacing:'.6px', marginBottom:3 }}>
                  {label}

          </div>
        </div>
      )}
    </div>
  );
}

// ─── Cash VaR Card ────────────────────────────────────────────────────────
function CashVaRCard({ sim, calc }) {
  const [varVol, setVarVol] = React.useState(0.12);
  const varResult = computeCashVaR(sim, calc, varVol);

  const cardStyle  = { background:'#fff', border:'1px solid #e2e8f0', borderRadius:12, padding:'20px 24px', boxShadow:'0 1px 3px rgba(15,23,42,.06)' };
  const labelStyle = { fontSize:10, fontWeight:700, color:'#94a3b8', textTransform:'uppercase', letterSpacing:'1px', marginBottom:8, display:'flex', alignItems:'center', gap:6 };

  const fmtV = (n) => {
    if (!n && n !== 0) return '—';
    const a = Math.abs(n);
    if (a >= 1e6) return '€' + (a/1e6).toFixed(2) + 'M';
    if (a >= 1e3) return '€' + Math.round(a/1e3) + 'k';
    return '€' + Math.round(a);
  };

  return (
    <div style={cardStyle}>
      <div style={labelStyle}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="1.8" strokeLinecap="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Cash VaR — Value at Risk
        <span style={{ marginLeft:'auto', fontSize:9, color:'#94a3b8' }}>Pool performance risk</span>
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:16,
        background:'#f8fafc', borderRadius:8, padding:'8px 14px', border:'1px solid #e2e8f0' }}>
        <span style={{ fontSize:10, fontWeight:700, color:'#94a3b8', textTransform:'uppercase',
          letterSpacing:'.7px', whiteSpace:'nowrap' }}>Balance volatility</span>
        <input type="range" min="3" max="35" step="1"
          value={Math.round(varVol * 100)}
          onChange={e => setVarVol(parseInt(e.target.value) / 100)}
          style={{ flex:1, accentColor:'#0b1929' }}/>
        <span style={{ fontFamily:'DM Mono, monospace', fontSize:13, fontWeight:700,
          color:'#0b1929', minWidth:36, textAlign:'right' }}>
          {Math.round(varVol * 100)}%
        </span>
      </div>

      {varResult && (
        <div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginBottom:14 }}>
            {[
              { label:'95% Daily VaR',  val:varResult.var95, sub:'1-in-20 day shortfall',  color:'#d97706' },
              { label:'99% Daily VaR',  val:varResult.var99, sub:'1-in-100 day shortfall', color:'#dc2626' },
              { label:'CVaR (95%)',      val:varResult.cvar,  sub:'Expected shortfall',     color:'#dc2626' },
            ].map(({ label, val, sub, color }) => (
              <div key={label} style={{ background:'#f8fafc', borderRadius:8,
                padding:'10px 12px', border:'1px solid #e2e8f0' }}>
                <div style={{ fontSize:9, color:'#94a3b8', fontWeight:700,
                  textTransform:'uppercase', letterSpacing:'.6px', marginBottom:5 }}>
                  {label}
                </div>
                <div style={{ fontFamily:'DM Mono, monospace', fontSize:15, fontWeight:700, color }}>
                  −{fmtV(val)}
                </div>
                <div style={{ fontSize:9, color:'#94a3b8', marginTop:3 }}>{sub}</div>
              </div>
            ))}
          </div>

          <div style={{ background:'#fff7ed', border:'1px solid #fed7aa', borderRadius:8, padding:'12px 14px' }}>
            <div style={{ fontSize:11, fontWeight:600, color:'#9a3412', marginBottom:6 }}>
              Interpretation
            </div>
            <div style={{ fontSize:12, color:'#7c2d12', lineHeight:1.6, fontWeight:300 }}>
              On <strong>95% of trading days</strong> the pool's net benefit will not deviate
              by more than <strong>{fmtV(varResult.var95)}</strong> from the daily expected
              saving of <strong>{fmtV(Math.abs(varResult.dailyExpected))}</strong>.
              The worst 5% of days may see a shortfall of up to <strong>{fmtV(varResult.cvar)}</strong> (CVaR).
              Annual VaR at 95%: <strong>{fmtV(varResult.annualVaR95)}</strong>.
            </div>
          </div>

          <div style={{ marginTop:10, fontSize:10, color:'#94a3b8', lineHeight:1.5 }}>
            VaR assumes normally distributed daily balance movements with {Math.round(varVol*100)}% annual volatility.
            This is a modelled estimate — actual results depend on group cash flow patterns.
            Standard methodology per Basel III / IFRS 7 liquidity risk reporting.
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Analysis Section ─────────────────────────────────────────────────────
function Analysis({ sim, fmtK, netBenefit, interestSave, paybackMo, nettingEff, poolBank }) {
  const calc = computeFromSim(sim);

  const [aiInput, setAiInput]     = React.useState('');
  const [aiAnswer, setAiAnswer]   = React.useState(null);
  const [aiLoading, setAiLoading] = React.useState(false);
  const [listening, setListening] = React.useState(false);
  const [tab, setTab]             = React.useState('rate');

  const base = {
    interest:  Math.round((interestSave || 842000) / 1000),
    payback:   paybackMo || 8.4,
    netting:   nettingEff || 73,
    breakeven: 140,
  };

  const poolBankName = poolBank || 'ING Bank';
  const debitRate    = sim?.debitRate  || 0.055;
  const creditRate   = sim?.creditRate || 0.028;
  const poolDebit    = sim?.poolDebit  || 0.032;
  const poolCredit   = sim?.poolCredit || 0.040;
  const surplus      = sim?.surplus    || 6200000;
  const deficit      = sim?.deficit    || 2100000;
  const implCost     = sim?.implCost   || 150000;
  const annualCosts  = sim?.annualCosts|| 70000;

  const ccy     = sim?.currency || 'EUR';
  const rateRef = ccy==='USD'?'SOFR':ccy==='GBP'?'SONIA':ccy==='CHF'?'SARON':'€STR';
  const rateBase= ccy==='USD'?5.32:ccy==='GBP'?5.19:ccy==='CHF'?1.48:3.91;

  const [rateShift, setRateShift] = React.useState(0);
  const [balShift,  setBalShift]  = React.useState(0);
  const [entCount,  setEntCount]  = React.useState((sim?.entities||[]).length||6);

  const SUGGESTED = [
    `What if ${rateRef} drops by 100bp?`,
    `Which entity contributes most?`,
    `When do we break even?`,
    `ZBA vs notional — which suits us?`,
    `What if we add a new entity with €1M surplus?`,
  ];

  function computeWhatIf() {
    let interest = base.interest;
    if (tab==='rate') {
      interest = Math.round(base.interest + rateShift * surplus/1e5 * 0.8 + rateShift * deficit/1e5 * 0.6);
    } else if (tab==='balance') {
      interest = Math.round(base.interest * (1 + balShift/100));
    } else {
      interest = Math.round(base.interest * Math.min(entCount / Math.max((sim?.entities||[]).length||6,1) * 0.85+0.15, 1.4));
    }
    const netBen = interest - Math.round(annualCosts/1000);
    const pb = netBen>0 ? Math.round(implCost/1000/netBen*12*10)/10 : 999;
    const above = interest - base.breakeven;
    const verdict = interest > base.breakeven*4 ? 'GO' : interest > base.breakeven ? 'CONSIDER' : 'NO-GO';
    return { interest, pb, above, verdict };
  }
  const wi = computeWhatIf();

  async function runAnalysis(question) {
    if (!question.trim()) return;
    setAiLoading(true); setAiAnswer(null);
    const context = `Group: ${sim?.groupName||'Sample Group'} | Bank: ${poolBankName} | Currency: ${ccy} | Entities: ${(sim?.entities||[]).map(e=>e.name).join(', ')||'6 entities'} | Pool balance: ${fmtK?fmtK(sim?.poolBalance||12300000):'+€12.3M'} | Interest saving: ${fmtK?fmtK(interestSave||842000):'€842k'} | Netting efficiency: ${nettingEff||73}% | Payback: ${paybackMo||8.4} months | ${rateRef}: ${rateBase}% | Pool debit: ${(poolDebit*100).toFixed(2)}% | Pool credit: ${(poolCredit*100).toFixed(2)}% | Bilateral debit: ${(debitRate*100).toFixed(2)}% | Bilateral credit: ${(creditRate*100).toFixed(2)}% | Implementation cost: €${Math.round(implCost/1000)}k | Annual pool costs: €${Math.round(annualCosts/1000)}k`;
    try {
      const res = await fetch(AI_WORKER, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ question, context }),
      });
      const data = await res.json();
      setAiAnswer(data.answer || 'No response received.');
    } catch(e) {
      setAiAnswer('AI analysis unavailable. Please check your connection or contact info@cashpoolmodel.com.');
    }
    setAiLoading(false);
  }

  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Voice input requires Chrome or Edge.'); return; }
    const r = new SR(); r.lang='en-US'; r.interimResults=false;
    r.onstart=()=>setListening(true); r.onend=()=>setListening(false); r.onerror=()=>setListening(false);
    r.onresult=(e)=>{ const t=e.results[0][0].transcript; setAiInput(t); runAnalysis(t); };
    r.start();
  }

  const whtExposure  = Math.round(deficit*0.015/1000);
  const notionalSave = Math.round(base.interest*0.92);
  const notionalNet  = notionalSave - whtExposure - Math.round(annualCosts/1000);
  const zbaNet       = base.interest - Math.round(annualCosts/1000);

  const cardStyle = { background:'#fff', border:'1px solid #e2e8f0', borderRadius:12, padding:'20px 24px', boxShadow:'0 1px 3px rgba(15,23,42,.06)' };
  const labelStyle = { fontSize:10, fontWeight:700, color:'#94a3b8', textTransform:'uppercase', letterSpacing:'1px', marginBottom:8, display:'flex', alignItems:'center', gap:6 };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>

      {/* ── AI ASK ── */}
      <div style={cardStyle}>
        <div style={labelStyle}>
          <Ico name="robot" size={13} color="#94a3b8"/>
          AI Analysis
        </div>

        {/* Input row */}
        <div style={{ display:'flex', gap:8, marginBottom:12 }}>
          <input
            value={aiInput}
            onChange={e=>setAiInput(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&runAnalysis(aiInput)}
            placeholder={`Ask about your pool — e.g. "What if ${rateRef} drops by 100bp?"`}
            style={{ flex:1, padding:'9px 13px', borderRadius:7, border:'1.5px solid #e2e8f0',
              background:'#f8fafc', fontFamily:'DM Sans,sans-serif', fontSize:13, color:'#0f172a', outline:'none' }}
          />
          <button onClick={startVoice} title="Voice input"
            style={{ width:38, height:38, borderRadius:7, border:'1.5px solid #e2e8f0',
              background:listening?'#fee2e2':'#f8fafc', cursor:'pointer', display:'flex',
              alignItems:'center', justifyContent:'center', flexShrink:0 }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke={listening?'#dc2626':'#64748b'} strokeWidth="1.8" strokeLinecap="round">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="9" y1="22" x2="15" y2="22"/>
            </svg>
          </button>
          <button onClick={()=>runAnalysis(aiInput)}
            style={{ padding:'9px 18px', borderRadius:7, background:'#0b1929', color:'#fff',
              fontFamily:'DM Sans,sans-serif', fontSize:13, fontWeight:600, border:'none', cursor:'pointer' }}>
            Analyze →
          </button>
        </div>

        {/* Suggested questions */}
        <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginBottom: (aiLoading||aiAnswer) ? 16 : 0 }}>
          {SUGGESTED.map((q,i)=>(
            <button key={i} onClick={()=>{setAiInput(q);runAnalysis(q);}}
              style={{ padding:'4px 11px', borderRadius:20, border:'1px solid #e2e8f0',
                background:'transparent', color:'#64748b', fontSize:11, fontWeight:500,
                cursor:'pointer', fontFamily:'DM Sans,sans-serif', transition:'all .13s' }}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='#0b1929';e.currentTarget.style.color='#0b1929';}}

        </div>

        {/* Answer */}
        {aiLoading && (
          <div style={{ borderTop:'1px solid #f1f5f9', paddingTop:14, display:'flex', flexDirection:'column', gap:7 }}>
            {[100,82,65].map((w,i)=>(
              <div key={i} style={{ height:13, width:w+'%', background:'linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%)',
                backgroundSize:'200% 100%', animation:'shimmer 1.5s infinite', borderRadius:4 }}/>
            ))}
          </div>
        )}
        {aiAnswer && (
          <div style={{ borderTop:'1px solid #f1f5f9', paddingTop:14 }}>
            <div style={{ fontSize:14, color:'#334155', lineHeight:1.8, whiteSpace:'pre-line', fontWeight:300, marginBottom:12 }}>

            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button onClick={()=>window.location.href='/contact.html'}

                  fontSize:11, fontWeight:600, border:'none', cursor:'pointer', fontFamily:'DM Sans,sans-serif' }}>

              <button onClick={()=>{setAiAnswer(null);setAiInput('');}}

                  fontSize:11, fontWeight:500, border:'1px solid #e2e8f0', cursor:'pointer', fontFamily:'DM Sans,sans-serif' }}>
                Clear

            </div>
          </div>
        )}
      </div>

      {/* ── WHAT-IF EXPLORER ── */}
      <div style={cardStyle}>
        <div style={labelStyle}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="1.8" strokeLinecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>

        {/* Tab switcher */}
        <div style={{ display:'inline-flex', background:'#f8fafc', borderRadius:8, padding:3, gap:2, marginBottom:18 }}>

                <td style={{ padding:'9px 0', textAlign:'right', fontSize:11, fontWeight:600, color:r.zbaW?'#059669':'#475569' }}>{r.zbaW?'ZBA ✓':'Notional ✓'}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{ marginTop:14, padding:'12px 14px', background:'#f8fafc', borderRadius:8,
          fontSize:12, color:'#334155', lineHeight:1.6 }}>
          <strong>Recommendation:</strong> ZBA generates
          <strong style={{ color:'#059669' }}> €{Math.max(0,zbaNet-notionalNet)}k more annually</strong> than
          notional pooling for your structure, primarily through eliminated WHT exposure.
          Proceed with zero-balancing.
        </div>
      </div>

      <MonteCarloCard sim={sim} calc={calc} />
      <CashVaRCard sim={sim} calc={calc} />

    </div>
  );
}

// ─── CTA fade-in after 45s or 2nd tab ─────────────────────────────────────
let _ctaShown = false;
let _tabCount = 0;
function trackTabForCTA(setCtaVisible) {
  _tabCount++;
  if (!_ctaShown && _tabCount >= 2) { _ctaShown = true; setCtaVisible(true); }
}
function loadSimData() {
  try {
    const raw = localStorage.getItem('cpm_sim');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function computeFromSim(sim) {
  if (!sim) return null;

  let surplus = sim.surplus || 0;
  let deficit = sim.deficit || 0;

  if (surplus === 0 && deficit === 0 && sim?.entities?.length > 0) {
    sim.entities.forEach(e => {
      const bal = typeof e.balance === 'number' ? e.balance : 0;
      if (bal > 0) surplus += bal;
      else if (bal < 0) deficit += Math.abs(bal);
    });
  }

  return {
    dr:          sim.debitRate   || 0.055,
    cr:          sim.creditRate  || 0.028,
    pdr:         sim.poolDebit   || 0.032,
    pcr:         sim.poolCredit  || 0.040,
    dcf:         sim.dayCount    || 1,
    netBenefit:  sim.netBenefit  || 842000,
    annualCosts: sim.annualCosts || 70000,
    wht:         sim.whtRate     || 0,
    intCostBef:  sim.intCostBef  || 0,
    surplus,
    deficit,
  };
}

// ─── Simulation Engine ────────────────────────────────────────────────────

function getCcySymbol(sim) {
  const cc = sim?.baseCurrency || sim?.currency || 'EUR';
  const map = {
    EUR:'€', USD:'$', GBP:'£', CHF:'CHF ', CZK:'Kč ',
    PLN:'zł ', HUF:'Ft ', SEK:'kr ', DKK:'kr ',
    NOK:'kr ', HKD:'HK$', SGD:'S$', JPY:'¥', AUD:'A$', CAD:'C$',
    AED:'AED ', TRY:'₺', RON:'lei ', CNY:'¥',
  };
  return map[cc] || cc + ' ';
}

function getCcyCode(sim) {
  return sim?.baseCurrency || sim?.currency || 'EUR';
}

function randNormal(mean, std) {
  let u, v;
  do { u = Math.random(); } while (u === 0);
  do { v = Math.random(); } while (v === 0);
  const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  return mean + std * z;
}

function simulateQuarterly(sim, calc, volatility = 0.12) {
  let surplus = sim?.surplus || 0;
  let deficit = sim?.deficit || 0;

  if (surplus === 0 && deficit === 0 && sim?.entities?.length > 0) {
    sim.entities.forEach(e => {
      const bal = typeof e.balance === 'number' ? e.balance : 0;
      if (bal > 0) surplus += bal;
      else if (bal < 0) deficit += Math.abs(bal);
    });
  }

  if (surplus === 0 && deficit === 0) { surplus = 3500000; deficit = 5200000; }
  const dr  = calc?.dr  || 0.055;
  const pdr = calc?.pdr || 0.032;
  const dcf = calc?.dcf || 1;
  const qf  = dcf / 4;

  const now = new Date();
  const quarters = [];
  for (let i = 3; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i * 3, 1);
    const q = Math.floor(d.getMonth() / 3) + 1;
    quarters.push(`Q${q} ${d.getFullYear()}`);
  }

  return quarters.map(period => {
    const qSurplus = Math.max(0, surplus * Math.max(0.3, 1 + randNormal(0, volatility)));
    const qDeficit = Math.max(0, deficit * Math.max(0.3, 1 + randNormal(0, volatility)));
    const qNetting = Math.min(qSurplus, qDeficit);

    // SAME deficit volume, two rates — answers: "what does our deficit cost at each rate?"
    // Gray:  bilateral rate (what group pays today)
    // Navy:  pool rate (what group would pay with pooling)
    const withoutK = Math.max(20, Math.round(qDeficit * dr  * qf / 1000));
    const pooledK  = Math.max(5,  Math.round(qDeficit * pdr * qf / 1000));

    // Netting saving — additional benefit shown in summary strip, not in bars
    const nettingSavingK = Math.round(qNetting * pdr * qf / 1000);

    return {
      period,
      without:       withoutK,
      pooled:        pooledK,
      nettingSaving: nettingSavingK,
    };
  });
}

function runMonteCarlo(sim, calc, volatility = 0.12, runs = 1000) {
  if (!sim || !calc) return null;

  const annualCosts = calc.annualCosts || 70000;
  const results = [];

  for (let i = 0; i < runs; i++) {
    const sig           = volatility;
    const surplusFactor = Math.max(0.1, 1 + randNormal(0, sig));
    const deficitFactor = Math.max(0.1, 1 + randNormal(0, sig));

    const adjSurplus = (sim.surplus || 0) * surplusFactor;
    const adjDeficit = (sim.deficit || 0) * deficitFactor;
    const adjNetting = Math.min(adjSurplus, adjDeficit);

    const debitSave    = adjDeficit * ((calc.dr || 0.055) - (calc.pdr || 0.032)) * (calc.dcf || 1);
    const creditUplift = adjSurplus * ((calc.pcr || 0.040) - (calc.cr || 0.028)) * (calc.dcf || 1);
    const nettingSave  = adjNetting * (calc.pdr || 0.032) * (calc.dcf || 1);
    const whtCost      = adjNetting * (calc.pdr || 0.032) * (calc.dcf || 1) * (calc.wht || 0);

    const annualSaving = debitSave + creditUplift + nettingSave - whtCost - annualCosts;
    results.push(Math.round(annualSaving));
  }

  results.sort((a, b) => a - b);

  const p = (pct) => results[Math.floor(pct / 100 * runs)];
  const positive = results.filter(r => r > 0).length;

  return {
    runs,
    results,
    p5:  p(5),
    p10: p(10),
    p25: p(25),
    p50: p(50),
    p75: p(75),
    p90: p(90),
    p95: p(95),
    mean: Math.round(results.reduce((a, b) => a + b, 0) / runs),
    probPositive: Math.round(positive / runs * 1000) / 10,
    probGt500k:   Math.round(results.filter(r => r > 500000).length / runs * 1000) / 10,
  };
}

function computeCashVaR(sim, calc, volatility = 0.12) {
  if (!sim || !calc) return null;

  const netBenefit   = calc.netBenefit || 0;
  const dailyBenefit = netBenefit / 365;
  const dailySigma   = Math.abs(dailyBenefit) * volatility / Math.sqrt(252);

  const var95 = Math.round(dailySigma * 1.645);
  const var99 = Math.round(dailySigma * 2.326);
  const cvar  = Math.round(dailySigma * 2.063);

  return {
    dailyExpected: Math.round(dailyBenefit),
    var95,
    var99,
    cvar,
    annualVaR95: Math.round(var95 * Math.sqrt(252)),
    annualVaR99: Math.round(var99 * Math.sqrt(252)),
  };
}

// ─── App root ─────────────────────────────────────────────────────────────

function App() {
  const [activeNav, setActiveNav] = useState('summary');
  const [ctaVisible, setCtaVisible] = useState(false);
  const sim = loadSimData();

  // CTA: show after 45s OR after 2nd tab click
  React.useEffect(() => {
    const t = setTimeout(() => { if(!_ctaShown){ _ctaShown=true; setCtaVisible(true); }}, 45000);
    return () => clearTimeout(t);
  }, []);

  function handleNav(id) {
    setActiveNav(id);
    trackTabForCTA(setCtaVisible);
  }

  // Override sample data with simulator input if available
  const groupName    = sim?.groupName    || 'Acme Manufacturing Group';
  const poolBank     = sim?.poolBank     || 'ING Bank';
  const totalEnt     = sim?.entities?.length || sim?.totalEntities || 8;
  const totalAcc     = sim?.totalAccounts|| 12;
  const poolBalance  = sim?.poolBalance  || 12300000;
  const simEntities  = sim?.entities     || null;

  // Compute KPIs from raw simulator rates & balances
  const calc        = computeFromSim(sim);
  const surplus     = calc?.surplus || 0;
  const deficit     = calc?.deficit || 0;
  const dr          = calc?.dr  || 0.055;
  const cr          = calc?.cr  || 0.028;
  const pdr         = calc?.pdr || 0.032;
  const pcr         = calc?.pcr || 0.040;
  const dcf         = calc?.dcf || 1;
  const annualCosts = calc?.annualCosts || 70000;
  const hasBalances = surplus > 0 || deficit > 0;
  const nettingMin  = Math.min(surplus, deficit);
  const computedNetting     = hasBalances ? Math.round(nettingMin / Math.max(surplus, deficit) * 100) : 73;
  const computedInterest    = hasBalances ? Math.round((deficit*(dr-pdr) + surplus*(pcr-cr)) * dcf) : 612000;
  const computedNetBenefit  = hasBalances ? Math.max(0, Math.round(computedInterest - annualCosts)) : 842000;
  const computedOpSave      = hasBalances ? Math.round(annualCosts) : 230000;
  const computedYieldSpread = calc ? ((pcr - cr) * 100).toFixed(2) : '1.20';
  const nettingEff   = (sim?.nettingEff    != null) ? sim.nettingEff    : computedNetting;
  const netBenefit   = (sim?.netBenefit    != null) ? sim.netBenefit    : computedNetBenefit;
  const interestSave = (sim?.interestSaving!= null) ? sim.interestSaving : computedInterest;
  const opSave       = (sim?.opSaving      != null) ? sim.opSaving      : computedOpSave;
  const paybackMo    = sim?.paybackMo     || 8.4;
  const yieldSpread  = (sim?.yieldSpread   != null) ? String(sim.yieldSpread) : computedYieldSpread;

  // Format helpers — currency follows pool base currency
  const ccy = getCcySymbol(sim);
  const fmtK = (n) => {
    const a = Math.abs(n);
    if (a >= 1000000) return (n < 0 ? '−' : '') + ccy + (a / 1000000).toFixed(2) + 'M';
    return (n < 0 ? '−' : '') + ccy + Math.round(a / 1000).toLocaleString('en-US') + 'k';
  };
  const fmtM = (n) => {
    const a = Math.abs(n);
    return (n>=0?'+':'−') + ccy + (a/1000000).toFixed(1) + 'M';
  };

  // Dynamic KPIs
  const dynKPIS = [
    { label:'Net Interest Savings', value:fmtK(interestSave),  badge: sim ? `↓ ${Math.round((interestSave / Math.max(calc?.intCostBef || interestSave * 2, 1)) * 100)}% cost` : '↑ 18.3%', sub:'vs. standalone arrangement',  ring:null },
    { label:'Netting Efficiency',   value:nettingEff+'%',      badge:'↑ 12pp',  sub:'above sector benchmark', ring:nettingEff },
    { label:'Operational Savings',  value:fmtK(opSave),        badge:'Additional',sub:'FX, facility fees, accounts', ring:null },
    { label:'Avg. Yield Spread',    value:'+'+yieldSpread+'%', badge:'+'+(parseFloat(yieldSpread)*100|0)+' bp', sub:'over pool benchmark rate', ring:null },
  ];

  // Dynamic entities for pool structure
  const dynEntities = simEntities ? simEntities.map(e => ({
    name: e.name,
    domicile: e.country,
    cc: e.cc,
    balance: (e.balance>=0?'+':'') + (e.cc==='EUR'?'€':'') + (Math.abs(e.balance)>=1e6?(Math.abs(e.balance)/1e6).toFixed(2)+'M':Math.round(Math.abs(e.balance)/1000)+'k'),
    balNum: e.balance,
    surplus: e.balance >= 0,
    sweep: '18:00 CET',
    resident: ['DE','FR','NL','AT','BE','IT','ES','CZ','SK','PL','HU'].includes(e.country),
    interestRate: e.balance>=0?((sim?.poolCredit||0.04)*100).toFixed(2)+'%':((sim?.poolDebit||0.032)*100).toFixed(2)+'%',
    annual: (e.balance>=0?'+':'−')+'€'+Math.round(Math.abs(e.balance)*(e.balance>=0?(sim?.poolCredit||0.04):(sim?.poolDebit||0.032))/1000)+'k',
    sweepDirection: e.sweepDirection || 'two-way',
    parentIdx: e.parentIdx,
    parentName: (() => {
      if (e.parentId != null) { const p = simEntities.find(p => p.id === e.parentId); return p ? p.name : null; }
      if (e.parentIdx != null && e.parentIdx !== '') { const p = simEntities[parseInt(e.parentIdx)]; return p ? p.name : null; }
      return null;
    })(),
  })) : ENTITIES;

  const dynPoolBalance = poolBalance;

  return (
    <div style={{ display:'flex', width:'100%', minHeight:'100vh', background:'#f8fafc' }}>
      <Sidebar active={activeNav} onNav={handleNav} groupName={groupName} totalEnt={totalEnt} ctaVisible={ctaVisible} />
      <MainContent active={activeNav} groupName={groupName} totalEnt={totalEnt} totalAcc={totalAcc}
        nettingEff={nettingEff} netBenefit={netBenefit} interestSave={interestSave}
        opSave={opSave} poolBalance={dynPoolBalance} paybackMo={paybackMo}
        yieldSpread={yieldSpread} dynKPIS={dynKPIS} dynEntities={dynEntities}
        poolBank={poolBank} fmtK={fmtK} fmtM={fmtM} sim={sim}/>
    </div>
  );
}
